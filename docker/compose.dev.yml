# HaspelSync from the rolling :dev image, which every -dev pre-release moves.
# For testing what is about to be released; :latest stays on the last stable
# version. Same layout as compose.yml otherwise.
#
#     docker compose -f docker/compose.dev.yml up -d
services:
  haspelsync:
    image: ghcr.io/rdiger-36/haspelsync:dev
    container_name: haspelsync
    ports:
      - 4000:4000
    environment:
      - TZ=Europe/Berlin
    # The image runs as user 1000:1000, which has to be able to write to both
    # directories: `mkdir -p data/printers data/logs && sudo chown -R 1000:1000
    # data/printers data/logs` before the first start. Another user is set here:
    # user: "1000:1000"
    volumes:
      - ./data/printers:/app/printers
      - ./data/logs:/app/logs
    restart: unless-stopped
