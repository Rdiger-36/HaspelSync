# HaspelSync built from this checkout, for trying a branch in a container
# before it is published. The build context is the repository root, where
# .dockerignore lives, so the image is the same one the publish workflow builds.
#
#     docker compose -f docker/compose.local.yml up -d --build
services:
  haspelsync:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: haspelsync:local
    container_name: haspelsync
    ports:
      - 4000:4000
    environment:
      - TZ=Europe/Berlin
    # The image runs as user 1000:1000, which has to be able to write to both
    # directories. On a Linux host: `mkdir -p data/printers data/logs && sudo
    # chown -R 1000:1000 data/printers data/logs` before the first start. Docker
    # Desktop on macOS and Windows needs nothing. Another user is set here:
    # user: "1000:1000"
    volumes:
      - ./data/printers:/app/printers
      - ./data/logs:/app/logs
    restart: unless-stopped
